[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invoicepdf"
version = "1.0.0"
description = "Generate clean invoice/receipt PDFs from JSON via a simple API. Pure Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["fpdf2>=2.7"]

[project.optional-dependencies]
serve = ["gunicorn>=21.0"]

[tool.hatch.build.targets.wheel]
packages = ["invoicepdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# SEO landing content is long-form HTML copy composed as multi-line strings.
"invoicepdf/seo.py" = ["E501", "ISC004"]
